[project]
name = "api-dashboard-v2"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.format]
# CRLF no Windows, LF no Linux (CI e Docker): igual ao .editorconfig e ao Prettier do front.
line-ending = "native"
# Os exemplos de código no README ficam como estão.
exclude = ["*.md"]
