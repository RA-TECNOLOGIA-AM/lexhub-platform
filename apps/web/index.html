<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/logo-justica.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LexHub</title>
        <!-- Aparência antes do React (senão a tela pisca com o tema errado ao abrir). Lê a cópia que
             src/lib/appearance.ts grava: { prefs, light: {variáveis}, dark: {variáveis} }.
             Sem cópia nova, o modo antigo ('lexhub.theme'); sem nada, o do sistema. Nunca lança. -->
        <script>
            ;(function () {
                var root = document.documentElement
                var cache = null
                var mode = null
                try {
                    cache = JSON.parse(localStorage.getItem('lexhub.appearance') || 'null')
                    mode = cache && cache.prefs ? cache.prefs.mode : localStorage.getItem('lexhub.theme')
                } catch (e) {}
                if (mode !== 'light' && mode !== 'dark') {
                    try {
                        mode = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
                    } catch (e) {
                        mode = 'light'
                    }
                }
                root.dataset.theme = mode
                var vars = cache && cache[mode]
                if (vars && typeof vars === 'object') {
                    for (var name in vars) {
                        if (name.indexOf('--') === 0) root.style.setProperty(name, String(vars[name]))
                    }
                }
            })()
        </script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
