name: CI

on:
    push:
        branches: [main]
    pull_request:

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    api:
        name: API (lint + testes)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: apps/api
        steps:
            -   uses: actions/checkout@v4
            -   uses: actions/setup-python@v5
                with:
                    python-version: "3.12"
                    cache: pip
                    cache-dependency-path: |
                        apps/api/requirements.txt
                        apps/api/requirements-dev.txt
            -   run: python -m pip install -r requirements.txt -r requirements-dev.txt
            -   run: python -m ruff check src tests
            -   run: python -m pytest -q

    db:
        name: Banco (migrations + testes)
        runs-on: ubuntu-latest
        services:
            postgres:
                image: postgres:17
                env:
                    POSTGRES_PASSWORD: postgres
                ports: ["5432:5432"]
                options: >-
                    --health-cmd "pg_isready -U postgres"
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 10
        env:
            PGHOST: localhost
            PGUSER: postgres
            PGPASSWORD: postgres
            PGDATABASE: postgres
        steps:
            -   uses: actions/checkout@v4
            -   name: Simular Supabase (auth + papéis)
                run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/ci/supabase_stub.sql
            -   name: Aplicar migrations
                run: |
                    for f in $(ls supabase/migrations/*.sql | sort); do
                        echo "==> $f"
                        psql -v ON_ERROR_STOP=1 -q -f "$f"
                    done
            -   name: Testes do banco
                run: |
                    for f in supabase/tests/*.sql; do
                        echo "==> $f"
                        psql -v ON_ERROR_STOP=1 -q -f "$f"
                    done
            -   name: Teste da importação V1 -> app
                run: |
                    psql -v ON_ERROR_STOP=1 -q -f supabase/tests/ci/v1_fixture.sql
                    sed 's/^rollback;.*$/commit;/' supabase/scripts/import_v1.sql > /tmp/import_v1_commit.sql
                    psql -v ON_ERROR_STOP=1 -q -f /tmp/import_v1_commit.sql
                    psql -v ON_ERROR_STOP=1 -q -f /tmp/import_v1_commit.sql
                    psql -v ON_ERROR_STOP=1 -q -f supabase/tests/ci/import_v1_assert.sql